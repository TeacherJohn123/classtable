if(a=="del"&&confirm("確定刪除 "+cur.c+" 的課表？")){for(const r in S.r)S.r[r].forEach(dy=>dy.forEach(ce=>{const i=ce.indexOf(cur.c);if(i>=0)ce.splice(i,1)}));delete S.c[cur.c];cur.c="";save()}
if(a=="imp"){try{const o=JSON.parse(document.getElementById("js").value);if(!o.c)throw 0;S=o;if(!S.r)S.r=JSON.parse(JSON.stringify(SEED.r));if(!S.log)S.log=[];if(!S.roles)S.roles={教學組長:"",教務主任:"",校長:""};if(!S.busy)S.busy=JSON.parse(JSON.stringify(SEED.busy));save();msg="已匯入"}catch(x){alert("JSON 格式不正確")}}
if(a=="rst"&&confirm("還原後會清除所有修改與調課申請，確定嗎？")){S=JSON.parse(JSON.stringify(SEED));S.v=12;S.log=[];S.roles={教學組長:"",教務主任:"",校長:""};S.busy=JSON.parse(JSON.stringify(SEED.busy));cur.ms=[];save()}}
render()});
document.addEventListener("change",e=>{const t=e.target;
if(t.dataset.k){const k=t.dataset.k;cur[k]=["p","fp","pp","win","sm","sgi","bd","bp"].includes(k)?+t.value:t.value;if(["fdt","pdt"].includes(k)&&!t.value)return;sel=null;msg="";if(k=="ft"||k=="fc"||k=="fdt"||k=="fp"||k=="win"||k=="fx")cur.sol=null}
else if(t.dataset.wk){if(t.value)cur.wk=mon(t.value);else return}
else if(t.dataset.hr){S.c[cur.c].hr=t.value.trim();save()}
else if(t.dataset.sj){const v=t.value.trim();if(v)S.c[cur.c].t[t.dataset.sj]=v;else delete S.c[cur.c].t[t.dataset.sj];save()}
else if(t.dataset.rs){cur.reason=t.value;return}
else if(t.dataset.fnote){cur.fnote=t.value;return}
else if(t.dataset.bl){cur.bl=t.value;return}
else if(t.dataset.wzc){cur.wz.c=t.value}
else if(t.dataset.wzd!==undefined){if(!t.value)return;cur.wz.nodes[+t.dataset.wzd].d=t.value}
else if(t.dataset.wzp!==undefined){cur.wz.nodes[+t.dataset.wzp].p=+t.value}
else if(t.dataset.role){S.roles=S.roles||{};S.roles[t.dataset.role]=t.value.trim();save()}
else if(t.dataset.who){cur.who=t.value;return}
else if(t.dataset.lr||t.dataset.lw){const e2=S.log.find(x=>x.id==(t.dataset.lr||t.dataset.lw));if(e2){if(t.dataset.lr)e2.r=t.value.trim();else e2.w=t.value.trim();save()}return}
else return;render()});
render();
</script>
